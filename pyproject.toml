[project]
name = "exhibita"
version = "0.1.0"
description = "AI security reviewer that proves the fix: exploit it, patch it, verify it — on an open model, offline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "dhruvdumra" }]
keywords = ["security", "sast", "ai", "gemma", "code-review", "sarif", "semgrep"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "httpx>=0.27",
    "rich>=13.7",
    "pyyaml>=6.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4"]
dev = ["pytest>=8.0"]

[project.scripts]
exhibita = "exhibita.cli:app"
exhibita-mcp = "exhibita.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exhibita"]

[tool.pytest.ini_options]
testpaths = ["tests"]
