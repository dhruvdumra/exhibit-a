name: "ExhibitA Security Review"
description: "Scan a PR, triage with Gemma 4, prove critical findings in a sandbox, and post one-click fixes."
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Directory to scan."
    default: "."
  backend:
    description: "AI backend: gemini (CI default) or ollama."
    default: "gemini"
  gemini-api-key:
    description: "Gemini API key (set from a repo secret). Needed when backend is gemini."
    required: false
  verify:
    description: "Prove critical findings in the sandbox."
    default: "true"
  comment:
    description: "Post inline review comments with one-click fixes."
    default: "true"
  changed-base:
    description: "Only triage/prove findings in files changed since this git ref (the PR base). Empty = full scan."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ExhibitA
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Run ExhibitA
      id: run
      shell: bash
      continue-on-error: true
      env:
        MODEL_BACKEND: ${{ inputs.backend }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
      run: |
        verify_flag=""
        [ "${{ inputs.verify }}" = "true" ] && verify_flag="--verify"
        changed_flag=""
        [ -n "${{ inputs.changed-base }}" ] && changed_flag="--changed ${{ inputs.changed-base }}"
        exhibita scan "${{ inputs.path }}" $verify_flag $changed_flag \
          --backend "${{ inputs.backend }}" \
          --sarif exhibita.sarif --markdown exhibita.md --comments exhibita-comments.json
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to the Security tab
      if: always() && hashFiles('exhibita.sarif') != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: exhibita.sarif

    - name: Job summary
      if: always() && hashFiles('exhibita.md') != ''
      shell: bash
      run: cat exhibita.md >> "$GITHUB_STEP_SUMMARY"

    - name: Post review with one-click fixes
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const { owner, repo } = context.repo;
          const pull_number = context.issue.number;
          let summary = "", comments = [];
          try { summary = fs.readFileSync('exhibita.md', 'utf8'); } catch (e) {}
          try { comments = JSON.parse(fs.readFileSync('exhibita-comments.json', 'utf8')); } catch (e) {}

          // GitHub rejects the whole review if any inline comment lands on a line
          // outside the diff, so keep only comments on lines the PR actually changed.
          const added = {};  // path -> Set of added line numbers (new-file side)
          const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number });
          for (const f of files) {
            const set = new Set();
            let line = 0;
            for (const row of (f.patch || "").split("\n")) {
              const m = row.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
              if (m) { line = parseInt(m[1], 10); continue; }
              if (row.startsWith("+") && !row.startsWith("+++")) { set.add(line); line++; }
              else if (!row.startsWith("-")) { line++; }
            }
            added[f.filename] = set;
          }
          const inDiff = comments.filter(c => added[c.path] && added[c.path].has(c.line));

          try {
            await github.rest.pulls.createReview({
              owner, repo, pull_number, event: 'COMMENT',
              body: summary || 'ExhibitA security review',
              comments: inDiff.map(c => ({ path: c.path, line: c.line, body: c.body })),
            });
          } catch (e) {
            core.warning('Inline review failed, posting a summary comment: ' + e.message);
            if (summary) await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body: summary });
          }

    - name: Enforce the build gate
      if: always()
      shell: bash
      run: |
        code="${{ steps.run.outputs.exit_code }}"
        if [ "$code" != "0" ]; then
          echo "ExhibitA gate failed (exit $code): a critical issue was proven exploitable."
          exit 1
        fi
