name: Publish to PyPI

# Publishes to PyPI automatically when you cut a GitHub Release — no token needed.
# Uses PyPI Trusted Publishing (OIDC); configure the publisher on PyPI once.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write        # required for Trusted Publishing — do not remove

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi     # must match the environment you set on PyPI's publisher
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
